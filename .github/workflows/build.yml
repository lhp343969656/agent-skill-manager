name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Windows (with installer)
        if: runner.os == 'Windows'
        run: wails build -nsis

      - name: Build
        if: runner.os != 'Windows'
        run: wails build

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r agent-skill-manager-macos.zip agent-skill-manager.app
          hdiutil create -volname "Agent Skill Manager" -srcfolder agent-skill-manager.app -ov -format UDZO agent-skill-manager.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: agent-skill-manager-${{ matrix.platform }}
          path: |
            build/bin/*.exe
            build/bin/*.zip
            build/bin/*.dmg
            build/bin/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" artifacts/**/*.exe artifacts/**/*.zip artifacts/**/*.dmg artifacts/**/*.AppImage --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}